<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Family Activities</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#056b91">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/dmsans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dmsans-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts */
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/dmsans-400.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/dmsans-500.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/dmsans-700.woff2') format('woff2');
}
@font-face {
  font-family: 'Newsreader';
  font-style: normal;
  font-weight: 600 700;
  font-display: swap;
  src: url('fonts/newsreader-latin.woff2') format('woff2');
}

/* Design tokens */
:root {
  --accent: #056b91;
  --accent-strong: #044e6b;
  --accent-soft: #e6f2f7;
  --on-accent: #ffffff;
  --surface: #ffffff;
  --bg: #eef4f7;
  --line: #bfd8e4;
  --text: #16282f;
  --muted: #4a6572;
  --green: #187a3c;
  --green-bg: #e4f4e9;
  --amber: #7a4a00;
  --amber-bg: #fdf0dc;
  --grey: #64767f;
  --grey-bg: #eef1f3;
  --radius: 0.75rem;
  --tabbar-h: 3.5rem;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4db3d9;
    --accent-strong: #7ccbe8;
    --accent-soft: #14313d;
    --on-accent: #06222d;
    --surface: #12242c;
    --bg: #0b1a20;
    --line: #23414d;
    --text: #e8f1f4;
    --muted: #9db4be;
    --green: #5fce8a;
    --green-bg: #123a22;
    --amber: #f0b429;
    --amber-bg: #3d2c0e;
    --grey: #9aa8ae;
    --grey-bg: #1c2b32;
  }
}
/* Manual theme override */
html[data-theme="light"] {
  --accent: #056b91; --accent-strong: #044e6b; --accent-soft: #e6f2f7; --on-accent: #ffffff;
  --surface: #ffffff; --bg: #eef4f7; --line: #bfd8e4; --text: #16282f; --muted: #4a6572;
  --green: #187a3c; --green-bg: #e4f4e9; --amber: #7a4a00; --amber-bg: #fdf0dc;
  --grey: #64767f; --grey-bg: #eef1f3; color-scheme: light;
}
html[data-theme="dark"] {
  --accent: #4db3d9; --accent-strong: #7ccbe8; --accent-soft: #14313d; --on-accent: #06222d;
  --surface: #12242c; --bg: #0b1a20; --line: #23414d; --text: #e8f1f4; --muted: #9db4be;
  --green: #5fce8a; --green-bg: #123a22; --amber: #f0b429; --amber-bg: #3d2c0e;
  --grey: #9aa8ae; --grey-bg: #1c2b32; color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 100%; }
body {
  margin: 0;
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 0.9375rem;
  line-height: 1.45;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
}
.app-header h1 {
  font-family: 'Newsreader', serif;
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0;
}
.icon-btn {
  min-width: 2.75rem; min-height: 2.75rem;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); color: var(--text);
  font-size: 1.125rem; cursor: pointer;
}

/* Tab panels */
.tab-panel { display: none; padding: 0 1rem 1rem; max-width: 40rem; margin: 0 auto; }
.tab-panel.active { display: block; }

/* Bottom tab bar */
.tab-bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  z-index: 30;
}
.tab-bar > div { display: flex; flex: 1; }
.tab-bar [role="tab"] {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.125rem;
  border: 0; background: none; color: var(--muted);
  font-size: 0.6875rem; font-weight: 500; cursor: pointer;
  min-height: var(--tabbar-h);
  font-family: inherit;
  padding: 0.25rem 0;
}
.tab-bar [role="tab"] .tab-icon { display: inline-flex; line-height: 1; }
.tab-bar [role="tab"][aria-selected="true"] { color: var(--accent); font-weight: 700; }
/* Icon-only tabs at large text sizes (labels kept for screen readers) */
@media (max-width: 24rem) {
  .tab-bar .tab-label {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0;
  }
}

/* Day headings */
.day-heading {
  font-family: 'Newsreader', serif;
  font-size: 1.75rem;
  font-weight: 700;
  margin: 1.25rem 0 0.25rem;
}
.day-sub { color: var(--muted); font-size: 0.8125rem; margin: 0 0 0.75rem; }

/* Band headings */
.band-heading {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 1rem 0 0.5rem;
  font-family: 'Newsreader', serif;
}
.nap-divider {
  text-align: center;
  color: var(--muted);
  font-size: 0.8125rem;
  padding: 0.5rem;
  margin: 0.5rem 0;
  border-top: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}

/* Compact cards */
.card {
  position: relative;
  display: grid;
  grid-template-columns: 4rem 1fr 2.75rem;
  gap: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--cat-color, var(--line));
  border-radius: var(--radius);
  padding: 0.625rem 0.5rem 0.625rem 0.75rem;
  margin-bottom: 0.75rem;
  min-height: 5.5rem;
  width: 100%;
  color: inherit;
}
.card-hit {
  position: absolute; inset: 0;
  border: 0; background: transparent; cursor: pointer;
  border-radius: var(--radius);
  padding: 0;
}
.card-hit:active { background: var(--accent-soft); }
.card-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-time {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--accent-strong);
  line-height: 1.3;
  padding-top: 0.125rem;
}
.card-main { min-width: 0; }
.card-title {
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.3;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-title .new-dot {
  display: inline-block;
  width: 0.5rem; height: 0.5rem;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 0.375rem;
  vertical-align: baseline;
}
.card-venue {
  font-size: 0.8125rem;
  color: var(--muted);
  margin: 0.125rem 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-facts {
  display: flex;
  gap: 0.75rem;
  font-size: 0.8125rem;
  color: var(--muted);
  flex-wrap: wrap;
}
.card-facts .fact { display: inline-flex; align-items: center; gap: 0.25rem; }
.fact-price-free { color: var(--green); font-weight: 700; }
.fact-status-confirmed { color: var(--green); font-weight: 600; }
.fact-status-call { color: var(--amber); font-weight: 600; }
.fact-status-unconfirmed { color: var(--grey); font-weight: 600; }
.card-star {
  position: relative; z-index: 1;
  display: flex; align-items: flex-start; justify-content: center;
  font-size: 1.375rem; color: var(--muted);
  background: none; border: 0; cursor: pointer;
  min-width: 2.75rem; min-height: 2.75rem;
  padding: 0.25rem;
  font-family: inherit;
}
.card-star[aria-pressed="true"] { color: var(--accent); }

/* Category left-border colours */
.card[data-category="sports"] { --cat-color: #2a7de1; }
.card[data-category="hubs"] { --cat-color: #7a4fd0; }
.card[data-category="music"] { --cat-color: #d0547a; }
.card[data-category="play"] { --cat-color: #c77e1f; }
.card[data-category="library"] { --cat-color: #2e9e5b; }
.card[data-category="events"] { --cat-color: #b03a48; }

/* Up next hero */
.upnext {
  background: var(--accent);
  color: var(--on-accent);
  border-radius: var(--radius);
  padding: 1rem;
  margin: 0.75rem 0 1rem;
  cursor: pointer;
  border: 0; width: 100%; text-align: left; font: inherit;
}
.upnext-label { font-size: 0.8125rem; opacity: 0.85; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.upnext-title { font-size: 1.25rem; font-weight: 700; margin: 0.25rem 0; font-family: 'Newsreader', serif; }
.upnext-meta { font-size: 0.9375rem; opacity: 0.92; }

/* Collapsed rows */
.collapsed-row {
  width: 100%;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  font: inherit; color: var(--text); cursor: pointer;
  min-height: 2.75rem;
}
.text-btn {
  background: none; border: 0; color: var(--accent); font: inherit;
  font-weight: 600; cursor: pointer; padding: 0.5rem; min-height: 2.75rem;
}

/* Free and easy horizontal cards */
.free-row { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; }
.free-card {
  flex: 0 0 10rem;
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  border: 1.5px solid var(--accent); border-radius: var(--radius);
  padding: 0.75rem; font-size: 0.8125rem;
  cursor: pointer; font: inherit; color: inherit; text-align: left;
}
.free-card strong { display: block; font-size: 0.9375rem; margin-bottom: 0.25rem; color: var(--accent); }
.free-card .free-detail { display: none; font-size: 0.8125rem; margin-top: 0.5rem; color: var(--ink); }
.free-card.expanded .free-detail { display: block; }
.free-card.expanded { flex-basis: 14rem; }

/* Filter chips */
.chip-row {
  display: flex; gap: 0.5rem; overflow-x: auto;
  padding: 0.75rem 1rem; margin: 0 -1rem;
  position: sticky; top: 3.5rem; z-index: 15;
  background: var(--bg);
}
.chip {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 0.375rem;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--text);
  padding: 0.5rem 0.875rem; font-size: 0.8125rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
  min-height: 2.75rem;
}
.chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.chip .chip-x { font-size: 1rem; line-height: 1; }

/* Bottom sheets */
.scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  z-index: 40;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: 85vh; overflow-y: auto;
  background: var(--surface); color: var(--text);
  border-radius: 1rem 1rem 0 0;
  padding: 0 1rem calc(1rem + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 0.25s ease-out;
  z-index: 50;
  max-width: 40rem; margin: 0 auto;
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 2.5rem; height: 0.25rem; border-radius: 999px;
  background: var(--line); margin: 0.625rem auto;
}
.sheet h2 { font-family: 'Newsreader', serif; font-size: 1.25rem; margin: 0.5rem 0; }
.sheet-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); font-size: 0.9375rem; }
.sheet-row .k { color: var(--muted); flex: 0 0 auto; }
.sheet-footer { font-size: 0.75rem; color: var(--muted); margin-top: 1rem; }
.btn-primary {
  display: block; width: 100%;
  background: var(--accent); color: var(--on-accent);
  border: 0; border-radius: 0.625rem;
  padding: 0.875rem; font-size: 1rem; font-weight: 700;
  cursor: pointer; margin: 0.75rem 0; font-family: inherit;
  min-height: 2.75rem;
  text-decoration: none; text-align: center;
}
.btn-secondary {
  display: block; width: 100%;
  background: var(--surface); color: var(--accent);
  border: 1px solid var(--accent); border-radius: 0.625rem;
  padding: 0.875rem; font-size: 1rem; font-weight: 600;
  cursor: pointer; margin: 0.5rem 0; font-family: inherit;
  min-height: 2.75rem; text-decoration: none; text-align: center;
}

/* Plan ahead date tiles */
.plan-row {
  position: relative;
  display: grid; grid-template-columns: 3.5rem 1fr 2.75rem;
  gap: 0.75rem; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.75rem; margin-bottom: 0.75rem; width: 100%;
  color: inherit; text-align: left;
}
.date-tile {
  text-align: center; line-height: 1.2;
}
.date-tile .d { font-size: 1.5rem; font-weight: 700; font-family: 'Newsreader', serif; }
.date-tile .m { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
.plan-meta { font-size: 0.8125rem; color: var(--muted); }

/* Week group headers */
.week-group { font-size: 1.25rem; font-weight: 700; font-family: 'Newsreader', serif; margin: 1.25rem 0 0.5rem; }

/* Day chips (Week tab) */
.day-chips {
  display: flex; gap: 0.5rem; overflow-x: auto;
  padding: 0.75rem 1rem; margin: 0 -1rem;
  position: sticky; top: 3.5rem; z-index: 15; background: var(--bg);
}
[id^="day-"] { scroll-margin-top: 8.5rem; }
.day-chip {
  flex: 0 0 auto; min-width: 3.5rem; min-height: 2.75rem;
  border: 1px solid var(--line); border-radius: 0.625rem;
  background: var(--surface); color: var(--text);
  font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.day-chip .dow { font-size: 0.6875rem; color: var(--muted); }
.day-chip .dom { font-size: 1rem; font-weight: 700; }
.day-chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day-chip[aria-current="true"] .dow { color: var(--on-accent); opacity: 0.85; }

/* Empty states */
.empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
.empty .btn-secondary { max-width: 16rem; margin: 1rem auto; }

/* Settings sheet rows */
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 0; border-bottom: 1px solid var(--line); min-height: 2.75rem; }

/* Stale-data banner */
.stale-banner {
  background: var(--amber-bg);
  border: 1px solid var(--amber);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  margin: 0.75rem 0;
  font-size: 0.875rem;
}
#main:focus { outline: none; }
#main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Skip link */
.skip-link { position: absolute; left: -9999px; }
.skip-link:focus { left: 1rem; top: 1rem; z-index: 100; background: var(--accent); color: var(--on-accent); padding: 0.875rem 1rem; border-radius: 0.5rem; min-height: 2.75rem; display: inline-flex; align-items: center; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim { transition: none; }
}

/* 200% text safety */
.card-title, .card-venue { overflow-wrap: anywhere; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to activities</a>
<header class="app-header">
  <h1>Family activities</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings and info" aria-haspopup="dialog">i</button>
</header>

<main id="main" tabindex="-1">
  <!-- TODAY TAB -->
  <section id="tab-today" class="tab-panel active" role="tabpanel" aria-label="Today" tabindex="0">
    <div class="chip-row" id="todayChips" role="toolbar" aria-label="Quick filters"></div>
    <div id="todayHeader"></div>
    <div id="upNext"></div>
    <div id="todayBands"></div>
    <h2 class="band-heading">Free and easy</h2>
    <div class="free-row" id="freeEasy"></div>
  </section>

  <!-- WEEK TAB -->
  <section id="tab-week" class="tab-panel" role="tabpanel" aria-label="Week" tabindex="0">
    <div class="chip-row" id="weekChips" role="toolbar" aria-label="Quick filters"></div>
    <div class="day-chips" id="dayChips" role="toolbar" aria-label="Days"></div>
    <div id="weekDays"></div>
  </section>

  <!-- PLAN AHEAD TAB -->
  <section id="tab-ahead" class="tab-panel" role="tabpanel" aria-label="Plan ahead" tabindex="0">
    <div class="chip-row" id="aheadChips" role="toolbar" aria-label="Quick filters"></div>
    <div id="planGroups"></div>
  </section>

  <!-- SAVED TAB -->
  <section id="tab-saved" class="tab-panel" role="tabpanel" aria-label="Saved" tabindex="0">
    <div id="savedList"></div>
  </section>
</main>

<nav class="tab-bar" aria-label="Main">
  <div role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true" aria-controls="tab-today"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="tab-label">Today</span></button>
    <button role="tab" data-tab="week" aria-selected="false" aria-controls="tab-week"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg></span><span class="tab-label">Week</span></button>
    <button role="tab" data-tab="ahead" aria-selected="false" aria-controls="tab-ahead"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L9 15"/><path d="M8.5 13.5l5-5 4 4-5 5z"/><path d="M13.5 8.5l3.5-3.5 2.5 2.5-3.5 3.5"/></svg></span><span class="tab-label">Plan ahead</span></button>
    <button role="tab" data-tab="saved" aria-selected="false" aria-controls="tab-saved"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></span><span class="tab-label">Saved</span></button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>

<!-- DETAIL SHEET -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="detailContent"></div>
</div>

<!-- FILTER SHEET -->
<div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="filterTitle">Filters</h2>
  <div id="filterGroups"></div>
  <div style="display:flex;gap:0.75rem;margin-top:1rem;">
    <button class="btn-secondary" id="clearFilters" style="flex:1;">Clear all</button>
    <button class="btn-primary" id="applyFilters" style="flex:2;">Show activities</button>
  </div>
</div>

<!-- SETTINGS SHEET -->
<div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>

<script>
'use strict';
/* ============ Date utilities ============ */
function todayKey() {
  const p = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  const o = {}; p.forEach(x => o[x.type] = x.value);
  return `${o.year}-${o.month}-${o.day}`;
}
function nowHM() {
  const p = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/London', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date());
  const o = {}; p.forEach(x => o[x.type] = x.value);
  return `${o.hour}:${o.minute}`;
}
function addDays(key, n) {
  const d = new Date(key + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function dateLabel(key) {
  const d = new Date(key + 'T12:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return { dow: days[d.getDay()], dom: d.getDate(), mon: months[d.getMonth()],
           full: `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}` };
}
function hmToMin(hm) { if (!hm) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; }

/* ============ Session expansion ============ */
function expandSessions(a, fromKey, toKey) {
  const out = [];
  const seen = new Set();
  (a.sessions || []).forEach(s => {
    if (s.date >= fromKey && s.date <= toKey) {
      out.push({ date: s.date, start: s.start || '', end: s.end || '', time_text: s.time_text || '' });
      seen.add(s.date);
    }
  });
  const r = a.recurrence;
  if (r && r.freq === 'weekly') {
    let d = fromKey;
    const until = r.until || toKey;
    const endKey = until < toKey ? until : toKey;
    while (d <= endKey) {
      const dt = new Date(d + 'T12:00:00');
      if (dt.getDay() === r.weekday && !(r.skip || []).includes(d)) {
        out.push({ date: d, start: r.start || '', end: r.end || '', time_text: '' });
        seen.add(d);
      }
      d = addDays(d, 1);
    }
  }
  // Multi-day and one-off events from later ranges: show on every day they run
  const laters = a.later_items || (a.later ? [a.later] : []);
  laters.forEach(L => {
    if (!L || !L.date) return;
    const end = L.date_end || L.date;
    let d = L.date > fromKey ? L.date : fromKey;
    const last = end < toKey ? end : toKey;
    const hrs = parseLaterHours(L.time_text);
    while (d <= last) {
      if (!seen.has(d)) {
        let tt = '';
        if (!hrs) {
          tt = stripDatePrefix(L.time_text || '');
          if (!tt || /\d{1,2}\s*([A-Za-z]{3}\s*)?[\u2013\u2014-]/.test(tt) || /daily/i.test(tt)) tt = 'Open all day';
        }
        out.push({
          date: d,
          start: hrs ? hrs.start : '',
          end: hrs ? hrs.end : '',
          time_text: tt,
          title: L.title || a.title,
          later: true
        });
        seen.add(d);
      }
      d = addDays(d, 1);
    }
  });
  return out;
}
function sessionTimeText(s) {
  if (s.time_text) return s.time_text;
  if (s.start && s.end) return s.start + '–' + s.end;
  if (s.start) return s.start;
  return 'Time tbc';
}

/* ============ TODAY TAB ============ */

  let items = [];

    expandSessions(a, nk, nk).forEach(s => {
      if (s.start && !clashesNap(s, a) && sessionMatches(s, a)) items.push({ a, s });
    });
  });
  items.sort(untimedLast);

function renderToday() {
  const tk = todayKey(), hm = nowHM();
  const dl = dateLabel(tk);

    `<h2 class="day-heading">${dl.dow} ${dl.dom} ${dl.mon}</h2><p class="day-sub">Nap 12:00–14:00</p>` + staleBanner(tk);

  // Collect today's sessions (explicit + recurrence + later-range events)
  let sessions = [];
  ACTIVITIES.forEach(a => {
    expandSessions(a, tk, tk).forEach(s => {
      if (sessionMatches(s, a)) sessions.push({ a, s });
    });
  });
  sessions.sort(untimedLast);

  const upcoming = sessions.filter(x => !isFinished(tk, x.s, x.a, tk, hm));
  // "Earlier" only for sessions with a real or computed end (untimed morning items just drop off)
  const earlier = sessions.filter(x => isFinished(tk, x.s, x.a, tk, hm) && (x.s.end || x.s.start));

    upEl.innerHTML = `<button class="upnext" data-id="${esc(upNext.a.id)}" data-date="${tk}">
      <div class="upnext-label">Up next</div>

  html += `<div class="nap-divider">Nap 12:00–14:00</div>`;
  html += `<h3 class="band-heading">Afternoon</h3>`;
  html += afternoon.length ? afternoon.map(x => cardHTML(x.a, x.s, tk)).join('') : `<div class="empty">Nothing this afternoon.</div>`;
  document.getElementById('todayBands').innerHTML = html;

  // Wire up toggles
  const se = document.getElementById('showEarlier');
  if (se) se.addEventListener('click', () => {
    const el = document.getElementById('earlierList');
    el.hidden = !el.hidden;
    if (!el.innerHTML) el.innerHTML = earlier.map(x => cardHTML(x.a, x.s, tk)).join('');

  document.getElementById('freeEasy').innerHTML = freebies.map((f, i) =>
    `<button class="free-card" data-free="${i}" aria-expanded="false"><strong>${esc(f.t)}</strong><span>${f.m}</span><span class="free-detail">${esc(f.d)}</span></button>`).join('');

  }));

      if (end < tk) return;
      if (!sessionMatches({ date: L.date, start: '', end: '' }, a)) return;
      items.push({ a, L });
    });
  });
  items.sort((x, y) => x.L.date < y.L.date ? -1 : 1);
  // Group from today: "This week", then "Half term · 24 Oct–1 Nov", then month names
  const groups = [];
  const gidx = {};
  function groupFor(dateKey) {
    const startKey = dateKey < tk ? tk : dateKey;
    let label, order;
    if (startKey <= addDays(tk, 7)) { label = 'This week'; order = 0; }
    else if (startKey.slice(0, 7) === tk.slice(0, 7)) { label = 'Half term · 24 Oct–1 Nov'; order = 1; }
    else {
      const d = new Date(startKey + 'T12:00:00');
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      label = months[d.getMonth()]; order = 10 + d.getMonth();
    }
    return { label, order };
  }
  items.forEach(it => {
    const g = groupFor(it.L.date);
    if (!(g.label in gidx)) { gidx[g.label] = groups.length; groups.push({ label: g.label, order: g.order, items: [] }); }
    groups[gidx[g.label]].items.push(it);
  });
  groups.sort((a, b) => a.order - b.order || (a.items[0].L.date < b.items[0].L.date ? -1 : 1));
  let html = '';
  groups.forEach(gr => {
    html += `<h2 class="week-group">${esc(gr.label)}</h2>`;
    gr.items.forEach(it => {
      const L = it.L, a = it.a;
      const d = dateLabel(L.date);
      const multi = L.date_end && L.date_end !== L.date;
      const started = L.date < tk;
      const tileDate = started
        ? `<span class="d">Now</span><br><span class="m">on</span>`
        : `<span class="d">${d.dom}</span><br><span class="m">${d.mon}</span>`;
      const timeBit = stripDatePrefix(L.time_text || '');
      let whenBit;
      if (multi) {
        whenBit = 'Daily until ' + dateLabel(L.date_end).dom + ' ' + dateLabel(L.date_end).mon;
        // Append hours only (skip bare date ranges like "17–18 Oct" and "daily")
        if (timeBit && /\d:\d/.test(timeBit)) whenBit += ' · ' + timeBit;
      } else {
        whenBit = timeBit;
      }
      const rowTitle = L.title || a.title;
      html += `<article class="plan-row">
        <button class="card-hit" data-id="${esc(a.id)}" data-date="${esc(L.date)}" aria-label="${esc(rowTitle)}"></button>
        <span class="date-tile" aria-hidden="true">${tileDate}</span>
        <span aria-hidden="true"><strong style="font-size:1.0625rem;">${esc(rowTitle)}</strong><br>
        <span class="plan-meta">${esc(whenBit)}${whenBit ? ' · ' : ''}${esc(placeLabel(a))}</span></span>
        <button class="card-star" data-star="${esc(a.id)}" aria-pressed="${isStarred(a.id)}" aria-label="Save ${esc(rowTitle)}">${isStarred(a.id) ? '★' : '☆'}</button>
      </article>`;
    });
  });
  document.getElementById('planGroups').innerHTML = html || `<div class="empty">Nothing planned yet.</div>`;
  wireCards(document.getElementById('planGroups'));
}

/* ============ SAVED TAB ============ */
function renderSaved() {
  const ids = Object.keys(starred);
  const items = ids.map(id => ACTIVITIES.find(a => a.id === id)).filter(Boolean);
  document.getElementById('savedList').innerHTML = items.length
    ? `<h2 class="day-heading">Saved</h2>` + items.map(a => cardHTML(a, { date: '', start: '', end: '', time_text: 'Saved' }, '')).join('')
    : `<div class="empty"><p>No saved activities yet.</p><p>Tap the ☆ on any activity to save it here.</p></div>`;
  wireCards(document.getElementById('savedList'));
}

/* ============ FILTER CHIPS ============ */
const QUICK_FILTERS = [
  { key: 'freeU2', label: 'Free for under-2s' },
  { key: 'walkable', label: 'Walkable' },
  { key: 'napSafe', label: 'Nap-safe' },
  { key: 'dropIn', label: 'Drop-in' },
  { key: 'needsBooking', label: 'Needs booking' }];
function renderChips(elId) {
  const el = document.getElementById(elId);
  let html = QUICK_FILTERS.map(f =>
    `<button class="chip" data-f="${f.key}" aria-pressed="${filters[f.key]}">${esc(f.label)}${filters[f.key] ? ' <span class="chip-x" aria-hidden="true">×</span>' : ''}</button>`).join('');
  const n = activeFilterCount();
  html += `<button class="chip" id="${elId}-more">Filters${n ? ` (${n})` : ''}</button>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-f]').forEach(c => {
    c.addEventListener('click', () => {
      filters[c.dataset.f] = !filters[c.dataset.f];
      refresh();
    });
  });
  document.getElementById(elId + '-more').addEventListener('click', openFilterSheet);
}
function clearFilters() {
  Object.keys(filters).forEach(k => { filters[k] = (k === 'category' || k === 'town' || k === 'travel') ? 'all' : false; });
  refresh();
}

/* ============ DETAIL SHEET ============ */
let lastFocus = null;
function openSheet(id) {
  lastFocus = document.activeElement;
  document.getElementById('scrim').classList.add('open');
  const sh = document.getElementById(id);
  sh.hidden = false;
  requestAnimationFrame(() => sh.classList.add('open'));
  const f = sh.querySelector('button, a');
  if (f) f.focus();
}
function closeSheets() {
  document.getElementById('scrim').classList.remove('open');
  document.querySelectorAll('.sheet.open').forEach(s => { s.classList.remove('open'); s.hidden = true; });
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function openDetail(id, dateKey) {
  const a = ACTIVITIES.find(x => x.id === id);
  if (!a) return;
  const st = activityStatus(a);
  const af = ageFit(a);
  const sessions = dateKey ? expandSessions(a, dateKey, dateKey) : [];
  const s = sessions[0] || { date: dateKey || '', start: '', end: '', time_text: '' };
  const dl = s.date ? dateLabel(s.date) : null;
  const displayTitle = s.title || a.title;
  let html = `<h2 id="detailTitle">${esc(displayTitle)}</h2>`;
  html += `<p style="color:var(--muted);font-size:0.9375rem;margin:0 0 0.5rem;">${dl ? esc(dl.full) + ' · ' : ''}${esc(sessionTimeText(s))}</p>`;
  const venueName = (a.venue && a.venue !== a.title && a.venue !== displayTitle) ? `${esc(a.venue)}<br>` : '';
  html += `<div class="sheet-row"><span class="k">Venue</span><span>${venueName}<a href="https://www.google.com/maps/search/${encodeURIComponent(a.address)}" target="_blank" rel="noopener" style="color:var(--accent);">Directions</a></span></div>`;
  html += `<div class="sheet-row"><span class="k">Travel</span><span>${esc(a.travel)}</span></div>`;
  html += `<div class="sheet-row"><span class="k">Price</span><span>${esc(priceLong(a))}</span></div>`;
  html += `<div class="sheet-row"><span class="k">Ages</span><span class="${af.ok ? '' : 'fact-status-call'}">${esc(af.label)}</span></div>`;
  const bsDetail = bookingStatus(a);
  const statusParts = [];
  if (st.label && !statusParts.includes(st.label)) statusParts.push(st.label);
  if (bsDetail && !statusParts.includes(bsDetail)) statusParts.push(bsDetail);
  const statusText = statusParts.join(' · ') || st.label;
  const statusCls = /call first/i.test(statusText) ? 'fact-status-call' : st.cls;
  html += `<div class="sheet-row"><span class="k">Status</span><span class="${statusCls}">${esc(statusText)}</span></div>`;
  const noteTxt = cleanNote(a.note);
  if (noteTxt) html += `<p style="font-size:0.9375rem;">${esc(noteTxt)}</p>`;
  if (a.url && (a.action === 'Book' || a.action === 'Check slots' || a.action === 'Event page' || a.action === 'Tickets')) {
    html += `<a class="btn-primary" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.action || 'Book')}</a>`;
  }
  if (a.phone) html += `<a class="btn-secondary" href="tel:${esc(a.phone.replace(/\s/g, ''))}">Call ${esc(a.phone)}</a>`;
  // Add to calendar
  if (s.date && s.start && s.end) {
    const ev = { title: a.title, start: s.date.replace(/-/g, '') + 'T' + s.start.replace(':', '') + '00', end: s.date.replace(/-/g, '') + 'T' + s.end.replace(':', '') + '00', location: a.address };
    const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.title) + '&dates=' + ev.start + '/' + ev.end + '&ctz=Europe/London&location=' + encodeURIComponent(ev.location);
    html += `<a class="btn-secondary" href="${url}" target="_blank" rel="noopener">Add to calendar</a>`;
  }
  html += `<button class="btn-secondary" id="detailSave">${isStarred(a.id) ? '★ Saved' : '☆ Save'}</button>`;
  const checkedTxt = a.verified ? (() => { const d = dateLabel(a.verified); return `Checked ${d.dom} ${d.mon}`; })() : 'Not checked yet';
  html += `<p class="sheet-footer">${esc(checkedTxt)}${a.source ? ` · <a href="${esc(a.source)}" target="_blank" rel="noopener" style="color:var(--muted);">source</a>` : ''}</p>`;
  document.getElementById('detailContent').innerHTML = html;
  openSheet('detailSheet');
  document.getElementById('detailSave').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleStar(a.id);
    e.target.textContent = isStarred(a.id) ? '★ Saved' : '☆ Save';
    document.querySelectorAll(`[data-star="${CSS.escape(a.id)}"]`).forEach(el => {
      el.setAttribute('aria-pressed', String(isStarred(a.id)));
      el.textContent = isStarred(a.id) ? '★' : '☆';
    });
  });
}

/* ============ FILTER SHEET ============ */
function openFilterSheet() {
  const cats = ['all', 'sports', 'hubs', 'music', 'play', 'library', 'events'];
  const towns = ['all', 'bexhill', 'hastings', 'st-leonards', 'eastbourne', 'battle', 'hailsham', 'villages'];
  const travels = ['all', 'walk', 'transit', 'drive'];
  let html = '<h3 style="font-size:1rem;">Category</h3><div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">';
  cats.forEach(c => { html += `<button class="chip" data-g="category" data-v="${c}" aria-pressed="${filters.category === c}">${c === 'all' ? 'All' : c}</button>`; });
  html += '</div><h3 style="font-size:1rem;">Town</h3><div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">';
  towns.forEach(t => { html += `<button class="chip" data-g="town" data-v="${t}" aria-pressed="${filters.town === t}">${townName(t)}</button>`; });
  html += '</div><h3 style="font-size:1rem;">Travel</h3><div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">';
  travels.forEach(t => { html += `<button class="chip" data-g="travel" data-v="${t}" aria-pressed="${filters.travel === t}">${t === 'all' ? 'All' : t}</button>`; });
  html += '</div>';
  document.getElementById('filterGroups').innerHTML = html;
  updateFilterCount();
  document.querySelectorAll('#filterGroups [data-g]').forEach(b => {
    b.addEventListener('click', () => {
      filters[b.dataset.g] = b.dataset.v;
      document.querySelectorAll(`#filterGroups [data-g="${b.dataset.g}"]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      updateFilterCount();
    });
  });
  openSheet('filterSheet');
}
function updateFilterCount() {
  // Count matching sessions across all tabs roughly
  const tk = todayKey();
  let n = 0;
  ACTIVITIES.forEach(a => {
    expandSessions(a, tk, addDays(tk, 7)).forEach(s => { if (sessionMatches(s, a)) n++; });
  });
  document.getElementById('applyFilters').textContent = `Show ${n} activities`;
}
function wireFilterSheet() {
  document.getElementById('clearFilters').addEventListener('click', () => { clearFilters(); closeSheets(); });
  document.getElementById('applyFilters').addEventListener('click', () => { closeSheets(); refresh(); });
}

/* ============ WIRING ============ */
function wireCards(root) {
  if (!root) return;
  root.querySelectorAll('.card-hit[data-id], .upnext[data-id]').forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    el.addEventListener('click', () => {
      openDetail(el.dataset.id, el.dataset.date);
    });
  });
  root.querySelectorAll('[data-star]').forEach(st => {
    if (st.dataset.swired) return;
    st.dataset.swired = '1';
    st.addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      toggleStar(st.dataset.star);
      document.querySelectorAll(`[data-star="${CSS.escape(st.dataset.star)}"]`).forEach(el => {
        el.setAttribute('aria-pressed', String(isStarred(st.dataset.star)));
        el.textContent = isStarred(st.dataset.star) ? '★' : '☆';
      });
    });
  });
}
function switchTab(name) {
  document.querySelectorAll('.tab-bar [role="tab"]').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === name));
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  window.scrollTo(0, 0);
}
function refresh() {
  const active = document.querySelector('.tab-bar [aria-selected="true"]').dataset.tab;
  if (active === 'today') renderToday();
  else if (active === 'week') renderWeek();
  else if (active === 'ahead') renderAhead();
  else renderSaved();
  renderChips('todayChips'); renderChips('weekChips'); renderChips('aheadChips');
}

/* ============ SETTINGS ============ */
function initSettings() {
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const tk = todayKey();
    document.getElementById('checkedLine').textContent = 'Listings checked ' + tk.split('-').reverse().join(' ') + '. Data: provider websites.';
    openSheet('settingsSheet');
  });
  const tt = document.getElementById('themeToggle');
  const cur = (() => { try { return localStorage.getItem('bex-theme'); } catch (e) { return null; } })();
  if (cur) { document.documentElement.dataset.theme = cur; tt.setAttribute('aria-pressed', String(cur === 'dark')); tt.textContent = cur === 'dark' ? 'On' : 'Off'; }
  tt.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('bex-theme', next); } catch (e) {}
    tt.setAttribute('aria-pressed', String(next === 'dark'));
    tt.textContent = next === 'dark' ? 'On' : 'Off';
  });
  const at = document.getElementById('ageToggle');
  at.setAttribute('aria-pressed', String(filters.showOlder));
  at.textContent = filters.showOlder ? 'On' : 'Off';
  at.addEventListener('click', () => {
    filters.showOlder = !filters.showOlder;
    at.setAttribute('aria-pressed', String(filters.showOlder));
    at.textContent = filters.showOlder ? 'On' : 'Off';
    refresh();
  });
  document.getElementById('installBtn').addEventListener('click', () => {
    alert('Use your browser\'s "Add to Home screen" / "Install app" option.');
  });
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tab-bar [role="tab"]').forEach(b => {
    b.addEventListener('click', () => { switchTab(b.dataset.tab); refresh(); });
  });
  document.getElementById('scrim').addEventListener('click', closeSheets);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  // Drag to close sheets
  document.querySelectorAll('.sheet').forEach(sh => {
    let startY = 0;
    sh.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
    sh.addEventListener('touchend', (e) => {
      const dy = e.changedTouches[0].clientY - startY;
      if (dy > 120) closeSheets();
    }, { passive: true });
  });
  wireFilterSheet();
  initSettings();
  // Expand buttons in week
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-expand]');
    if (b) {
      weekExpanded[b.dataset.expand] = !weekExpanded[b.dataset.expand];
      renderWeek();
    }
  });
  renderToday();
  renderWeek();
  renderAhead();
  renderSaved();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
